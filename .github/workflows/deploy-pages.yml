name: Deploy Website

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'website/**'
      - 'site/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # Install all workspace dependencies from the root lockfile.
          # This workspace already includes `site`, `site/site`, and `website`,
          # so a second frozen install inside `site/site` is redundant and can
          # fail against the nested `site/pnpm-lock.yaml`.
          pnpm install --frozen-lockfile

      - name: Build ui-react package
        run: |
          cd packages/ui-react
          pnpm build
          cd ../..

      - name: Build website
        id: build
        run: |
          if [ -d "website" ] && [ -f "website/package.json" ]; then
            echo "Building from website directory..."
            cd website
            pnpm build
            cd ..
            echo "path=website/dist" >> $GITHUB_OUTPUT
          elif [ -d "site/site" ] && [ -f "site/site/package.json" ]; then
            echo "Building from site/site directory..."
            cd site/site
            pnpm build
            cd ../..
            echo "path=site/site/.vitepress/dist" >> $GITHUB_OUTPUT
          elif [ -d "site" ] && [ -f "site/.vitepress/config.ts" ]; then
            echo "Building from site directory..."
            cd site
            pnpm build
            cd ..
            echo "path=site/.vitepress/dist" >> $GITHUB_OUTPUT
          else
            echo "No valid website directory found"
            exit 1
          fi

      - name: Verify website sitemap output
        if: ${{ steps.build.outputs.path == 'website/dist' }}
        run: |
          test -f website/dist/sitemap-index.xml
          test -f website/dist/sitemap-0.xml
          grep -q '<loc>https://pompelmi.app/sitemap-0.xml</loc>' website/dist/sitemap-index.xml
          grep -q '<loc>https://pompelmi.app/</loc>' website/dist/sitemap-0.xml

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ steps.build.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
