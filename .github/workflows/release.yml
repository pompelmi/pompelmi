name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish root package to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view pompelmi@$VERSION version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "pompelmi@$VERSION already published — skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish sub-packages to npm
        run: |
          publish_pkg() {
            local dir=$1
            local name=$(node -p "require('./${dir}/package.json').name")
            local ver=$(node -p "require('./${dir}/package.json').version")
            local exists=$(npm view "${name}@${ver}" version 2>/dev/null || echo "")
            if [ -n "$exists" ]; then
              echo "${name}@${ver} already published — skipping."
            else
              echo "Publishing ${name}@${ver}..."
              npm publish "./${dir}" --access public
            fi
          }
          publish_pkg packages/fastify
          publish_pkg packages/hono
          publish_pkg packages/nestjs
          publish_pkg packages/nextjs
          publish_pkg packages/remix
          publish_pkg packages/sveltekit
          publish_pkg packages/testing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [VERSION]" to the next "## [" heading (exclusive)
          BODY=$(awk "
            /^## \[${VERSION}\]/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          " CHANGELOG.md | sed '/^[[:space:]]*$/{ N; /^\n$/d }' | sed '1{/^$/d}')

          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/pompelmi/pompelmi/blob/main/CHANGELOG.md) for full details."
          fi

          # Extract a one-line summary: first non-empty content line after the date header
          SUMMARY=$(echo "$BODY" | grep -m1 '^\*\*\|^-\|^###\|^[A-Z]' | sed 's/^### //;s/^\*\*//;s/\*\*$//' | head -c 80)
          if [ -z "$SUMMARY" ]; then
            SUMMARY="Release $GITHUB_REF_NAME"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Write body to a file to avoid quoting issues
          printf '%s' "$BODY" > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — ${{ steps.changelog.outputs.summary }}"
          generate_release_notes: false
          body_path: /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
