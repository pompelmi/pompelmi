name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view pompelmi@$VERSION version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $VERSION already published on npm — skipping."
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@pompelmi'
      - run: npm ci
      - name: Publish to GitHub Packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view pompelmi@$VERSION version \
            --registry https://npm.pkg.github.com 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version $VERSION already published on GitHub Packages — skipping."
            exit 0
          fi
          npm publish --@pompelmi:registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: .github/release-template.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
