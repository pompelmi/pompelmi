name: Dependency Version Bump

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependency-version-bump-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  bump:
    name: Bump Root Version After Dependency Merge
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          # Use the automation PAT so this push can trigger the existing
          # release workflow on main after the version bump commit lands.
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bump root package patch version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.version.outputs.old != steps.version.outputs.new
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json

          # This workflow only reacts to merged PRs, so the release bump commit
          # cannot retrigger itself. release.yml keeps tag/release creation in
          # the existing flow after this metadata-only commit lands on main.
          git commit -m "chore(release): v$NEW_VERSION"
          git push origin HEAD:main
