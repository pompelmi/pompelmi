# ──────────────────────────────────────────────────────────────────────────────
# Example: scan your repository for viruses on every push and pull request.
# Copy this file into your own .github/workflows/ directory.
# ──────────────────────────────────────────────────────────────────────────────
name: Virus Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    name: ClamAV Virus Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan for viruses
        id: scan
        uses: pompelmi/pompelmi@v1.7.0
        with:
          path: '.'           # scan the whole workspace (default)
          fail-on-virus: 'true'

      # Access outputs in subsequent steps
      - name: Show scan result
        if: always()
        run: |
          echo "Status:         ${{ steps.scan.outputs.status }}"
          echo "Infected files: ${{ steps.scan.outputs.infected-files }}"
