name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki pages
        run: |
          git clone https://github.com/${{ github.repository }}.wiki.git /tmp/wiki

          for file in wiki/*.md; do
            filename=$(basename "$file")
            # Convert filename to wiki page title format
            # docker-setup.md → Docker-Setup.md
            title=$(echo "$filename" | sed 's/-/ /g' | sed 's/\b\w/\u&/g' | sed 's/ /-/g')
            cp "$file" "/tmp/wiki/$title"
          done

          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "docs: sync wiki from main branch"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
