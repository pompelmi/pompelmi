name: Renovate

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Create Dependency PRs
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false

      - name: Validate Renovate token
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret RENOVATE_TOKEN. Add a classic PAT with public_repo (or repo for private repos) plus workflow scope."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v44.0.2
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
