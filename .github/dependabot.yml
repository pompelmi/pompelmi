version: 2

multi-ecosystem-groups:
  daily-maintenance:
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - dependencies

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "daily-maintenance"
    allow:
      - dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "daily-maintenance"
